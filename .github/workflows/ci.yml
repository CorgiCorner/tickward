name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The required check is the "checks" gate job below. It succeeds only when
  # this job and every unit-test shard succeeded.
  static-checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      # Runs before npm ci/build so the scan does not traverse node_modules or .next.
      - name: Secret scan (gitleaks CLI, pinned release)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --no-banner --redact --exit-code 1
      # Catches workflow syntax and expression-context errors (for example an
      # env context that is invalid at job level) before they surface as a
      # failed run on a pushed release branch.
      - name: Workflow lint (actionlint CLI, pinned release)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.3
      - name: Check development runtime
        run: npm run check:node
      - run: npm ci
      - name: Dependency audit
        run: npm run security:dependencies
      - run: npm run lint
      - name: Typecheck
        run: npm exec tsc -- --noEmit
      - name: Public-mirror guardrails
        if: github.event.repository.private
        run: npm run test:release-guardrails
      - name: Cache Next.js build output
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  unit-tests:
    name: Unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.3
      - name: Check development runtime
        run: npm run check:node
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit -- --shard=${{ matrix.shard }}/2

  checks:
    needs: [static-checks, unit-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: ${NEEDS_RESULTS}"
          read -r -a results <<< "${NEEDS_RESULTS}"
          if [ "${#results[@]}" -ne 2 ]; then
            echo "::error::Expected 2 needed job results, got ${#results[@]}."
            exit 1
          fi
          for result in "${results[@]}"; do
            if [ "${result}" != "success" ]; then
              echo "::error::A needed job finished with result '${result}'."
              exit 1
            fi
          done

  public-snapshot:
    name: Public snapshot
    if: github.repository == 'CorgiCorner/tickward-private'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Setup Java 21 for Copybara
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Copybara
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/corgicorner-copybara
          key: copybara-${{ runner.os }}-${{ hashFiles('scripts/run-copybara-snapshot.sh') }}
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate isolated public snapshot
        env:
          # Analysis temporarily disabled by the owner on 2026-10-16.
          TICKWARD_SONAR_POLICY: disabled
        run: |
          artifact_args=()
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            artifact_args=(--emit-artifact "$RUNNER_TEMP/public-snapshot-artifact")
          fi
          scripts/publish-public.sh --validate-only "${artifact_args[@]}"
      - name: Upload verified public snapshot
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-snapshot-${{ github.sha }}
          path: ${{ runner.temp }}/public-snapshot-artifact/*
          retention-days: 30
          if-no-files-found: error
          overwrite: true
